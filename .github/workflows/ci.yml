  #       if: always()
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: lint-report
  #         path: |
  #           LINT_REPORT.md
  #           LINT_REPORT.json
  #           LINT_OUTPUT.log

  # ---------------------------------------------------------------------------
  # Test — build from source + unit tests + perf regression check
  # All three OS versions must pass (fail-fast: true cancels on first failure).
  # ---------------------------------------------------------------------------
  test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.sha || github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Homebrew downloads
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: brew-${{ runner.os }}-

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libzstd-dev zlib1g-dev liblz4-dev libdeflate-dev libbz2-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config zstd lz4 libdeflate bzip2 blake3 || true

      - name: Build Rust binary (default)
        run: make mar

      - name: Rust unit tests
        run: cargo test --release --manifest-path rust/Cargo.toml

      - name: Rust CLI integration tests
        run: |
          ./mar version
          ./mar --help
          MAR_BIN="${GITHUB_WORKSPACE}/mar" ./tests/integration_test.sh

      - name: Build C++ reference implementation
        run: make cpp -j

      - name: C++ unit tests
        run: make test-cpp

  # ---------------------------------------------------------------------------
  # Python test matrix — validates pymar across supported Python versions
  # ---------------------------------------------------------------------------
  test-python:
    name: Python Tests (${{ matrix.python-version }} on ${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
        include:
          - os: macos-latest
            python-version: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.sha || github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic certifi

      - name: Build pymar wheel & install
        run: |
          pip install ./python

      - name: Run pymar unit and integration tests
        run: |
          pytest python/tests -v

  # ---------------------------------------------------------------------------
  # Distribution build — produces the release artifacts
  #
  # Builds 3 clean release binaries:
  #   1. Linux x86_64: static musl binary (portable across all Linux distros/containers)
  #   2. Linux ARM64: static musl binary (AWS Graviton, Raspberry Pi, ARM servers)
  #   3. macOS ARM64: Apple Silicon native binary (M-series Macs)
  #
  # Only runs after all test matrix entries pass.
  # ---------------------------------------------------------------------------
  dist:
    name: Distribution Build (${{ matrix.artifact-name }})
    needs: [test, test-python]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            artifact-name: mar-linux-x86_64
            deb-arch: amd64
            use-cross: false
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            artifact-name: mar-linux-arm64
            deb-arch: arm64
            use-cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact-name: mar-macos-arm64
            use-cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.sha || github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install cross (Linux ARM64 cross-compile)
        if: matrix.use-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build distribution binary
        run: |
          mkdir -p dist
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --manifest-path rust/Cargo.toml --bin mar
          else
            cargo build --release --target ${{ matrix.target }} --manifest-path rust/Cargo.toml --bin mar
          fi
          TARGET_DIR=$(cargo metadata --format-version 1 --manifest-path rust/Cargo.toml | sed -n 's/.*"target_directory":"\([^"]*\)".*/\1/p')
          cp "${TARGET_DIR}/${{ matrix.target }}/release/mar" "dist/${{ matrix.artifact-name }}"
          chmod +x "dist/${{ matrix.artifact-name }}"
          ls -lh dist/

      - name: Smoke test native binary
        if: matrix.use-cross == false
        run: |
          "./dist/${{ matrix.artifact-name }}" version
          "./dist/${{ matrix.artifact-name }}" --help

      - name: Build Debian package (.deb)
        if: matrix.deb-arch != ''
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then
            VERSION=$(cat VERSION 2>/dev/null || echo "0.3.0")
          fi
          ./scripts/build_deb.sh "dist/${{ matrix.artifact-name }}" "${{ matrix.deb-arch }}" "${VERSION}" dist
          ls -lh dist/*.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mar-binaries-${{ matrix.artifact-name }}
          path: |
            dist/${{ matrix.artifact-name }}
            dist/*.deb
          # 30 days for release tags, 1 day for everything else
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 30 || 1 }}

  # ---------------------------------------------------------------------------
  # Integration tests — run against the dist binary (Linux x86_64)
  #
  # This is the key bootstrapping step: the binary under test is the exact
  # artifact that would be shipped to users. MAR_BIN overrides the default
  # ./mar path in integration_test.sh.
  # ---------------------------------------------------------------------------
  integration-test:
    name: Integration Tests (Linux x86_64 musl)
    needs: dist
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.sha || github.sha }}

      - name: Download distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: mar-binaries-mar-linux-x86_64
          path: dist/

      - name: Run integration tests
        run: |
          if [ ! -f "dist/mar-linux-x86_64" ]; then
            echo "❌ ERROR: Distribution binary not found at dist/mar-linux-x86_64!"
            ls -lh dist/ || echo "dist directory is empty"
            exit 1
          fi
          
          echo "✅ Found binary: $(ls -lh dist/mar-linux-x86_64)"
          chmod +x dist/mar-linux-x86_64
          dist/mar-linux-x86_64 version
          MAR_BIN="${GITHUB_WORKSPACE}/dist/mar-linux-x86_64" \
            ./tests/integration_test.sh

  # ---------------------------------------------------------------------------
  # Release — creates a GitHub Release and attaches distribution binaries
  # Only runs on v* tag pushes. Both dist and integration-test must pass.
  # ---------------------------------------------------------------------------
  release:
    name: Create Release
    needs: [integration-test, dist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-dist
          pattern: mar-binaries-*
          merge-multiple: true

      - name: Verify release binaries and compute checksums
        run: |
          cd all-dist
          ls -lh
          chmod +x mar-* 2>/dev/null || true
          if [ -f "mar-linux-x86_64" ]; then
            ./mar-linux-x86_64 version
          fi
          # Verify .deb packages have proper contents (man page & completions)
          for deb in *.deb; do
            if [ -f "$deb" ]; then
              echo "Inspecting $deb:"
              dpkg -c "$deb" | grep -E "usr/share/man|usr/share/bash-completion|usr/share/zsh" || {
                echo "ERROR: $deb is missing man page or completions"
                exit 1
              }
            fi
          done
          sha256sum mar-linux-* mar-macos-* *.deb > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: all-dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout (for formula update)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update Homebrew formula with SHA256
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          TARBALL_URL="https://github.com/earthframe/mar/archive/refs/tags/v${VERSION}.tar.gz"
          
          # Download and compute SHA256 from the public GitHub release tarball
          SHA256=$(curl -sL "$TARBALL_URL" | sha256sum | cut -d' ' -f1)
          
          # Validate SHA256 format (should be 64 hex characters)
          if ! [[ "$SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            echo "ERROR: Invalid SHA256 hash computed: $SHA256"
            exit 1
          fi
          
          # Update the formula file with version-specific values
          sed -i.bak "s|url \".*\"|url \"$TARBALL_URL\"|" .homebrew/mar.rb
          sed -i.bak "s/sha256 \".*\"/sha256 \"$SHA256\"/" .homebrew/mar.rb
          rm .homebrew/mar.rb.bak
          
          # Verify the file was updated correctly
          if ! grep -q "$SHA256" .homebrew/mar.rb; then
            echo "ERROR: Failed to update formula with SHA256"
            exit 1
          fi
          
          # Create a commit with the updated formula
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .homebrew/mar.rb
          git commit -m "Update Homebrew formula for v${VERSION}" -m "Auto-generated by CI/CD. SHA256 computed from public source tarball."
          git push
        env:
          # GitHub automatically provides a scoped token for this repository
          # It only has access to this repo and expires after the workflow completes
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
