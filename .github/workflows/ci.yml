  #         python3 scripts/lint_report.py --format md < LINT_OUTPUT.log > LINT_REPORT.md
  #         python3 scripts/lint_report.py --format json < LINT_OUTPUT.log > LINT_REPORT.json
  #         make lint CLANG_FORMAT=clang-format-21 CLANG_TIDY=clang-tidy-21
