name: CI/CD

# Triggers:
#   - push to main and version tags (always run)
#   - pull_request to main (always run)
#   - workflow_dispatch (manual, with optional SHA for testing a specific commit)
#   - workflow_call (called by trigger.yml for PR comment gating — Phase 3)
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to build (leave empty to use the current ref)'
        required: false
        default: ''
  workflow_call:
    inputs:
      sha:
        description: 'Commit SHA to build'
        required: false
        default: ''
        type: string

# Cancel any in-progress run for the same ref or SHA when a new one starts.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.sha || github.ref }}
  cancel-in-progress: true

# =============================================================================
# Job graph
#
#   test (matrix: 22.04 / 24.04 / macOS) ──► dist (Linux x86_64, Linux ARM64, macOS ARM64) ──► integration-test ──► release
#
# A compile failure on any test matrix entry (fail-fast: true) cancels the
# other matrix entries immediately. dist, integration-test, and release only
# run if all preceding jobs pass. release only runs on v* tag pushes.
# =============================================================================

jobs:

  # ---------------------------------------------------------------------------
