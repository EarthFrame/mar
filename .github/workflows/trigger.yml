name: PR Comment Trigger

# Fires on every new comment on any issue or PR.
# The gate job immediately exits if the comment is not on a PR,
# not from an approved user, or does not contain a recognized command.
on:
  issue_comment:
    types: [created]

# These permissions apply to all jobs in this workflow, including the
# CI workflow called via workflow_call. Granting the minimum required set:
#   issues/pull-requests write  — post reactions and status comments
#   contents write              — required by the release job in ci.yml
#   actions write               — required to cancel in-progress runs
permissions:
  issues: write
  pull-requests: write
  contents: write
  actions: write

jobs:
  # ---------------------------------------------------------------------------
  # Gate — validates the commenter and command, then either:
  #   - sets triggered=true + sha for the CI job to act on, or
  #   - handles a cancel/stop command and exits, or
  #   - exits silently with triggered=false
  # ---------------------------------------------------------------------------
  gate:
    name: Evaluate Comment
    # Only proceed if this is a comment on a PR, not a plain issue.
    if: github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    outputs:
      triggered: ${{ steps.evaluate.outputs.triggered }}
      sha:       ${{ steps.evaluate.outputs.sha }}

    steps:
      - name: Evaluate comment and dispatch command
        id: evaluate
        uses: actions/github-script@v7
        with:
          script: |
            const owner     = context.repo.owner;
            const repo      = context.repo.repo;
            const prNumber  = context.issue.number;
            const commentId = context.payload.comment.id;
            const commenter = context.payload.comment.user.login;
            const body      = context.payload.comment.body.trim();
            const lower     = body.toLowerCase();

            // ----------------------------------------------------------------
            // 1. Load the approved-users list from the default branch.
            //    Reading from main (not the PR branch) is a security requirement:
            //    a PR author must not be able to add themselves by modifying this
            //    file in their PR.
            // ----------------------------------------------------------------
            let approvedUsers = [];
            try {
              const { data } = await github.rest.repos.getContent({
                owner, repo,
                path: '.github/ci-approvers',
                // No ref — defaults to the repo's default branch (main)
              });
              const text = Buffer.from(data.content, 'base64').toString('utf-8');
              approvedUsers = text
                .split('\n')
                .map(l => l.trim())
                .filter(l => l && !l.startsWith('#'));
            } catch (err) {
              core.warning(`Could not read .github/ci-approvers: ${err.message}`);
              core.setOutput('triggered', 'false');
              return;
            }

            if (!approvedUsers.includes(commenter)) {
              core.info(`Skipping: @${commenter} is not in ci-approvers`);
              core.setOutput('triggered', 'false');
              return;
            }

            // ----------------------------------------------------------------
            // 2. Recognized commands
            // ----------------------------------------------------------------

            // -- cancel ci / stop ci -----------------------------------------
            if (lower.includes('cancel ci') || lower.includes('stop ci')) {
              await github.rest.reactions.createForIssueComment({
                owner, repo, comment_id: commentId, content: 'eyes',
              });

              const pr = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              const headSha = pr.data.head.sha;

              // Find all in-progress ci.yml runs for this commit.
              const { data: runData } = await github.rest.actions.listWorkflowRuns({
                owner, repo,
                workflow_id: 'ci.yml',
                head_sha: headSha,
                status: 'in_progress',
              });

              if (runData.workflow_runs.length === 0) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: prNumber,
                  body: `No in-progress CI run found for \`${headSha.slice(0, 7)}\`.`,
                });
              } else {
                for (const run of runData.workflow_runs) {
                  await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                }
                const count = runData.workflow_runs.length;
                await github.rest.issues.createComment({
                  owner, repo, issue_number: prNumber,
                  body: `🛑 Cancelled ${count} in-progress CI run(s) for \`${headSha.slice(0, 7)}\`.`,
                });
              }

              core.setOutput('triggered', 'false');
              return;
            }

            // -- run tests ----------------------------------------------------
            if (!lower.includes('run tests')) {
              core.info(`Skipping: no recognized command in comment`);
              core.setOutput('triggered', 'false');
              return;
            }

            // Post 👀 immediately so the commenter knows the trigger was seen.
            await github.rest.reactions.createForIssueComment({
              owner, repo, comment_id: commentId, content: 'eyes',
            });

            // Fetch the PR head SHA. We cannot use github.sha here because
            // issue_comment runs against the default branch, not the PR commit.
            const pr = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const sha = pr.data.head.sha;

            // Post a status comment with a direct link to this workflow run.
            const runUrl =
              `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner, repo, issue_number: prNumber,
              body: [
                `🚀 CI triggered by @${commenter} for \`${sha.slice(0, 7)}\``,
                ``,
                `[View run →](${runUrl})`,
              ].join('\n'),
            });

            core.setOutput('triggered', 'true');
            core.setOutput('sha', sha);

  # ---------------------------------------------------------------------------
  # CI — calls the main workflow with the resolved PR head SHA.
  # Only runs when gate sets triggered=true (i.e. approved user + run tests).
  # ---------------------------------------------------------------------------
  ci:
    name: CI
    needs: gate
    if: needs.gate.outputs.triggered == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      sha: ${{ needs.gate.outputs.sha }}
    # Pass the caller's GITHUB_TOKEN to the called workflow so the release
    # job (contents: write) and other steps have correct permissions.
    secrets: inherit
