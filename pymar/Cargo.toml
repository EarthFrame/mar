[workspace]
members = []

[package]
name = "pymar-crate"
version = "0.2.0"
edition = "2021"
authors = ["EarthFrame Corporation <info@earthframe.ai>"]
description = "High-performance Python bindings and Rust engine for the MAR archive format"
license = "MIT"

[lib]
name = "_mar"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["abi3-py38"], optional = true }
zstd = "0.13"
lz4_flex = "0.11"
flate2 = "1.0"
bzip2 = "0.4"
crc32fast = "1.4"
blake3 = { version = "1.5", features = ["rayon"] }
twox-hash = "1.6"
memmap2 = "0.9"
parking_lot = "0.12"
rayon = "1.10"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "0.7", optional = true }

[features]
default = []
extension-module = ["pyo3/extension-module"]
io_uring = ["dep:io-uring"]

[[bin]]
name = "mar"
path = "src/bin/main.rs"

[[bin]]
name = "mar-bench-rust"
path = "src/bin/bench.rs"
